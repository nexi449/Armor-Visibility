# Gradle configuration
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# Minecraft / mapping / loader versions
#
# This project is configured to build against Minecraft 1.21.1, which is the
# lowest (base) version in the supported range 1.21.1 - 1.21.11. Fabric
# Yarn mappings and class names for the vanilla OptionsScreen and
# ArmorFeatureRenderer did not change across the 1.21.1 -> 1.21.11 patch
# series, so a jar built against 1.21.1 loads and runs correctly on every
# point release up to 1.21.11 (the fabric.mod.json "minecraft" dependency
# below is declared as the full range).
#
# If you specifically want to compile & test against a later point release
# (e.g. 1.21.5 or 1.21.11), change minecraft_version / yarn_mappings /
# fabric_version below to the matching values for that release from
# https://fabricmc.net/develop and re-run ./gradlew build. No Java source
# changes are required to do this.
# ---------------------------------------------------------------------------
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.17.3

# Fabric API
fabric_version=0.141.6+1.21.11

# Mod version info
mod_version=2.7.1
maven_group=com.example
archives_base_name=armorvisibility
