plugins {
    id 'fabric-loom' version '1.17.16'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Required for Fabric Loom and Fabric API artifacts.
    maven {
        url = "https://maven.fabricmc.net/"
    }
    maven {
        url = "https://maven.terraformersmc.com/releases"
    }
    mavenCentral()
}

loom {
    // Client-only mod: split source sets are not required for this project,
    // everything here already only touches client-side classes.
}

dependencies {
    // Minecraft + mappings + loader — required by every Fabric mod.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API — needed for ScreenEvents used to inject the settings button.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu integration for the in-game configuration button.
    modImplementation "com.terraformersmc:modmenu:17.0.0"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Minecraft 1.21.x targets Java 21.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
