plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Required for Fabric Loom and Fabric API artifacts.
    maven {
        url = "https://maven.fabricmc.net/"
    }
    maven {
        url = "https://maven.terraformersmc.com/releases"
    }
    mavenCentral()
}

loom {
    // Client-only mod: split source sets are not required for this project,
    // everything here already only touches client-side classes.
}

dependencies {
    // Minecraft + loader — official Mojang mappings are built into Loom for 26.x.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API — needed for ScreenEvents used to inject the settings button.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional Mod Menu API integration; don't force it into the dev runtime.
    compileOnly "com.terraformersmc:modmenu:20.0.3"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Minecraft 26.x targets Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
