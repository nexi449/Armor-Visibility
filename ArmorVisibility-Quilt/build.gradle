plugins {
    id 'org.quiltmc.loom' version '1.15.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Quilt Loom and Fabric API repositories.
    maven {
        url = "https://maven.fabricmc.net/"
    }
    maven {
        url = "https://maven.quiltmc.org/repository/release"
    }
    maven {
        url = "https://maven.terraformersmc.com/releases"
    }
    mavenCentral()
}

loom {
    mods {
        "armorvisibility" {
            sourceSet("main")
        }
    }
}

dependencies {
    // Minecraft + Yarn mappings + Quilt Loader.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
    modCompileOnly "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    // Quilt Loader supports Fabric API mods, so the existing API calls stay unchanged.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional ModMenu integration for a config button in the Mod Menu screen.
    modCompileOnly "com.terraformersmc:modmenu:12.0.0"
}

processResources {
    inputs.properties "version": project.version, "group": project.group

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    filesMatching("quilt.mod.json") {
        expand "version": project.version, "group": project.group
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Minecraft 1.21.x targets Java 21.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
