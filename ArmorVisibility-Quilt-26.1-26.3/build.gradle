plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Quilt Loom and Fabric API repositories.
    maven {
        url = "https://maven.fabricmc.net/"
    }
    maven {
        url = "https://maven.quiltmc.org/repository/release"
    }
    maven {
        url = "https://maven.terraformersmc.com/releases"
    }
    mavenCentral()
}

loom {
    mods {
        "armorvisibility" {
            sourceSet("main")
        }
    }

    runs {
        client {
            devLaunchMainClass = "org.quiltmc.loader.impl.launch.knot.KnotClient"
        }
    }
}

dependencies {
    // Minecraft + official Mojang mappings + Quilt Loader.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "org.quiltmc:quilt-loader:${project.quilt_loader_version}"
    compileOnly "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    implementation "org.quiltmc:quilt-json5:1.0.4+final"
    implementation "org.quiltmc:quilt-config:1.3.3"

    // Quilt Loader supports Fabric API mods, so the existing API calls stay unchanged.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional ModMenu integration for a config button in the Mod Menu screen.
    compileOnly "com.terraformersmc:modmenu:20.0.3"
}

processResources {
    inputs.properties "version": project.version, "group": project.group

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    filesMatching("quilt.mod.json") {
        expand "version": project.version, "group": project.group
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Minecraft 26.x targets Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

def modJar = tasks.named("jar")
tasks.register("installRunMod", Copy) {
    dependsOn modJar
    from(modJar.flatMap { it.archiveFile })
    into(layout.projectDirectory.dir("run/mods"))
    outputs.upToDateWhen { false }
    doFirst {
        project.delete(fileTree(layout.projectDirectory.dir("run/mods")) {
            include("armorvisibility-*.jar")
        })
    }
}

tasks.named("runClient") {
    dependsOn("installRunMod")
}
